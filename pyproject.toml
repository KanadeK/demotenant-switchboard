[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "demotenant-switchboard"
version = "0.1.0"
description = "Generate resettable SaaS demo tenants, personas, business records, and Playwright tours from YAML scenario recipes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "KanadeK" }]
keywords = ["demo-data", "saas", "seed-data", "playwright", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "Faker==26.0.0",
  "Jinja2==3.1.4",
  "PyYAML==6.0.3",
  "pydantic==2.12.4",
  "typer==0.12.5",
]

[project.optional-dependencies]
dev = [
  "build==1.2.1",
  "mypy==2.3.0",
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "ruff==0.5.6",
  "playwright==1.56.0",
]

[project.scripts]
demotenant-switchboard = "demotenant_switchboard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/demotenant_switchboard"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/examples",
  "/docs",
  "/tests",
  "/scripts",
  "/README.md",
  "/README.zh-CN.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/Makefile",
]

[tool.hatch.build]
include = [
  "src/demotenant_switchboard/templates/*.j2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["demotenant_switchboard"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["demotenant_switchboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
