name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Secret-like pattern scan
        run: python scripts/secret_scan.py
      - name: Verify generated output guard
        run: python -m pytest -q tests/integration/test_generation_outputs.py::test_secret_like_output_fails_validation
